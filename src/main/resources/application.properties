spring.application.name=KeelungSightsViewer
server.port=${PORT:8080}

# MongoDB configuration for Docker environment
spring.data.mongodb.host=${MONGODB_HOST:mongodb}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=sights
spring.data.mongodb.username=${MONGODB_USER:sightsUser}
spring.data.mongodb.password=${MONGODB_PASSWORD:sightsPassword}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:sights}

# Alternative configuration for MongoDB Atlas (comment out above and uncomment below)
# spring.data.mongodb.uri=mongodb+srv://${MONGODB_USER}:${MONGODB_PASSWORD}@cluster.mongodb.net/?retryWrites=true&w=majority&appName=SightDB
